name: Deploy Frontend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Install PM2
        run: |
          set -euxo pipefail
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

      - name: Deploy application on Mac mini
        env:
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euxo pipefail
          cd /Users/macmini/planlog/planlog-frontend
          pwd
          whoami
          git branch --show-current
          git status --short
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"
          chmod +x ./deploy.sh
          ./deploy.sh
